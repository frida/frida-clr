name: Release

on:
  push:
    tags:
      - '*'
  workflow_dispatch:

env:
  # The gir.core codegen tools still target net9.0; let them run on the
  # installed .NET 10 runtime so CI needs only the one SDK.
  DOTNET_ROLL_FORWARD: Major

jobs:
  windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { host: windows-x86,    sys: MINGW32,    pkg: mingw-w64-i686-gcc }
          - { host: windows-x86_64, sys: UCRT64,     pkg: mingw-w64-ucrt-x86_64-gcc }
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v7
        with:
          go-version: 'stable'
      - name: Install MinGW toolchain for cgo support
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.sys }}
          install: ${{ matrix.pkg }}
      - run: .\configure.bat --host=${{ matrix.host }} -- "-Dfrida-core:compiler_backend=enabled"
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
      - run: .\make.bat
      - uses: actions/upload-artifact@v7
        with:
          name: packages-${{ matrix.host }}
          path: build/**/*.nupkg

  windows-arm64:
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v7
        with:
          go-version: 'stable'
      - name: Install MinGW toolchain for cgo support
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANGARM64
          install: mingw-w64-clang-aarch64-clang
      - run: .\configure.bat --host=windows-arm64 -- "-Dfrida-core:compiler_backend=enabled"
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
      - run: .\make.bat
      - uses: actions/upload-artifact@v7
        with:
          name: packages-windows-arm64
          path: build/**/*.nupkg

  macos:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        host:
          - macos-x86_64
          - macos-arm64
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v7
        with:
          go-version: 'stable'
      - name: Install signing certificate
        env:
          CERTIFICATES_P12: ${{ secrets.APPLE_CERTIFICATES_P12 }}
          CERTIFICATES_PASSWORD: ${{ secrets.APPLE_CERTIFICATES_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/apple-certificates.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/frida-signing.keychain-db
          echo -n "$CERTIFICATES_P12" | base64 --decode --output $CERTIFICATE_PATH
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security import $CERTIFICATE_PATH -P "$CERTIFICATES_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH
          rm $CERTIFICATE_PATH
          certid=$(security find-identity -v -p codesigning | grep "Developer ID Application: " | awk '{ print $2 }')
          echo "MACOS_CERTID=$certid" >> $GITHUB_ENV
      - run: ./configure --host=${{ matrix.host }} -- -Dfrida-core:compiler_backend=enabled
      - run: make
      - uses: actions/upload-artifact@v7
        with:
          name: packages-${{ matrix.host }}
          path: build/**/*.nupkg

  linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        host:
          - linux-x86
          - linux-x86_64
          - linux-armhf
          - linux-arm64
          - linux-mips64
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v7
        with:
          go-version: 'stable'
      - name: Configure
        run: |
          case "${{ matrix.host }}" in
            linux-armhf) host=arm-linux-gnueabihf; pkgs="gcc-$host g++-$host" ;;
            linux-arm64) host=aarch64-linux-gnu; pkgs="gcc-$host g++-$host" ;;
            linux-mips64) host=mips64-linux-gnuabi64; pkgs="gcc-$host g++-$host" ;;
            linux-x86) host=linux-x86; pkgs="gcc-multilib g++-multilib" ;;
            *) host="${{ matrix.host }}"; pkgs="" ;;
          esac
          if [ -n "$pkgs" ]; then sudo apt-get update && sudo apt-get install -y $pkgs; fi
          # mips64 lacks Go cgo cross support, so let it fall back to auto
          if [ "${{ matrix.host }}" = "linux-mips64" ]; then
            ./configure --host="$host"
          else
            ./configure --host="$host" -- -Dfrida-core:compiler_backend=enabled
          fi
      - run: make
      - uses: actions/upload-artifact@v7
        with:
          name: packages-${{ matrix.host }}
          path: build/**/*.nupkg

  publish:
    needs:
      - windows
      - windows-arm64
      - macos
      - linux
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    environment: production
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: packages-*
          path: packages
          merge-multiple: true
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - uses: NuGet/login@v1
        id: login
        with:
          user: oleavr
      - run: >
          dotnet nuget push "packages/**/*.nupkg"
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
